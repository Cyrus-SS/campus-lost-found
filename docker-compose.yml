x-backend: &backend
  build: ./backend
  env_file: ./backend/.env

services:
  backend1:
    <<: *backend
    environment:
      - INSTANCE_NAME=backend1
  backend2:
    <<: *backend
    environment:
      - INSTANCE_NAME=backend2
  backend3:
    <<: *backend
    environment:
      - INSTANCE_NAME=backend3

  nginx:
    image: nginx:alpine
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3